name: Build and deploy ASP.Net Core app to Azure Web App - FiscalHost-Inteligente

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 1. Compilar apuntando al proyecto correcto
      - name: Build with dotnet
        run: dotnet build FiscalHost.Api.CR/FiscalHost.Api.CR.csproj --configuration Release

      # 2. Publicar en una carpeta relativa a la raíz del repo
      - name: dotnet publish
        run: dotnet publish FiscalHost.Api.CR/FiscalHost.Api.CR.csproj -c Release -o ./myapp

      # 3. Subir el artefacto desde la ruta relativa correcta
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF9B003A53E4BD4BF18D1142292E557 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E23B2A369C664C49865BE04495C0F285 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7777E25CD3F34EF49E27F98D216416D4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FiscalHost-Inteligente'
          slot-name: 'Production'
          package: ./myapp  # <-- Corregido: apunta a la carpeta del artefacto
