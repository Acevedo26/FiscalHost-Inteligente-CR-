name: Build and deploy ASP.Net Core app to Azure Web App - FiscalHost-Inteligente

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 1. Restaurar dependencias NuGet (solo la primera vez que cambian)
      - name: Restore
        run: dotnet restore FiscalHost.sln

      # 2. Compilar TODO (API + tests) para verificar que el código completo compila.
      #    Compilar no empaca: nada de esto entra en el artefacto.
      - name: Build solution (verification only, nothing shipped)
        run: dotnet build FiscalHost.sln --no-restore --configuration Release

      # 3. Quality gate: correr los tests. Si fallan, el job falla y el deploy NUNCA se ejecuta.
      - name: Run tests (deploy gate)
        run: dotnet test FiscalHost.Tests/FiscalHost.Tests.csproj --no-build --configuration Release

      # 4. Empacar SOLO el proyecto de la API. --no-build reutiliza la salida Release
      #    del paso 2: se compila una vez, se publica una vez, los tests no entran jamás.
      - name: Publish API project only
        run: dotnet publish FiscalHost.Api.CR/FiscalHost.Api.CR.csproj --no-build --configuration Release -o ./myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Puerta de aprobación: el job queda en "Waiting" hasta que un revisor
    # apruebe en GitHub → Settings → Environments → production → Required reviewers.
    # Además, el subject OIDC pasa a ser environment:production (ver README/ops).
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact for deployment job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF9B003A53E4BD4BF18D1142292E557 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E23B2A369C664C49865BE04495C0F285 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7777E25CD3F34EF49E27F98D216416D4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FiscalHost-Inteligente'
          slot-name: 'Production'
          package: ./myapp
